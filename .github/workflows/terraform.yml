name: Terraform

on:
  push:
    branches:
      - feature
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enviorment/Prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sign in to Azure
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false -backend-config="storage_account_name=teststorage087" -backend-config="container_name=test-scenerio" -backend-config="key=prod.terraform.tfstate" -backend-config="use_azuread_auth=true"

      - name: Terraform Plan
        run: terraform plan -input=false -no-color

  apply:
    name: Terraform Apply
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enviorment/Prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sign in to Azure
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          az login --service-principal \
            --username "eb49ab4d-0b62-4aeb-9816-635402c9f909" \
            --password "Y448Q~tdVfCSYa.Fw4ezn0JCQqlxQ6IrUPi9na0h" \
            --tenant "468c391b-b59b-498c-8676-0b015e2ac28c"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false -backend-config="storage_account_name=teststorage087" -backend-config="container_name=test-scenerio" -backend-config="key=prod.terraform.tfstate" -backend-config="use_azuread_auth=true"

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
